[project]
name = "caramuru-api"
version = "0.1.0"
description = "Caramurú Field Engineering API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "geoalchemy2>=0.16.0",
    "geojson-pydantic>=1.2.0",
    "redis>=5.2.1",
    "ruff>=0.8.6",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "PyJWT>=2.10.1,<3",
    "minio>=7.2.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.6",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
